<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inloggen — Tennis Tossen</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="login-box">
  <h1>🎾 Tennis Tossen</h1>
  {% with berichten = get_flashed_messages() %}
    {% for b in berichten %}<div class="flash">{{ b }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <label>Wachtwoord
      <input type="password" name="wachtwoord" autofocus required>
    </label>
    <button type="submit">Inloggen</button>
  </form>
</main>
</body>
</html>
